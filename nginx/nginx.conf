# nginx reverse proxy / load balancer for the Reelo API.
#
# It proxies to the `server` Compose service. Because the upstream is given via
# a variable, nginx re-resolves it through Docker's embedded DNS (127.0.0.11)
# on each request — and Docker returns the addresses of every `server` replica
# round-robin, so traffic is balanced across all scaled instances.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # $upstream_addr shows which instance served each request.
  log_format lb '$remote_addr -> $upstream_addr "$request" $status ${request_time}s';
  access_log /var/log/nginx/access.log lb;

  # Docker's embedded DNS; short TTL so new/removed replicas are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # Forward the real client info so the app (TRUST_PROXY=true) keys rate
    # limiting on the actual client rather than the proxy.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location / {
      set $backend "server:4000";
      proxy_pass http://$backend$request_uri;
    }
  }
}
