# Local development stack: API + MongoDB + Redis.
# Usage: docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Stateless API. No host port is published so it can be scaled to N replicas
  # (`docker compose up --scale server=3`); the nginx LB is the only entrypoint.
  server:
    build:
      context: ./server
    restart: unless-stopped
    expose:
      - '4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      CORS_ORIGINS: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/reelo
      REDIS_URL: redis://redis:6379
      # We sit behind nginx, so trust X-Forwarded-* for correct client IPs.
      TRUST_PROXY: 'true'
      # Dev-only secrets — override in real environments.
      JWT_ACCESS_SECRET: dev-access-secret-please-change-me-0123456789
      JWT_REFRESH_SECRET: dev-refresh-secret-please-change-me-0123456789
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Reverse proxy / load balancer — the public entrypoint, balancing across
  # all `server` replicas.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data:
