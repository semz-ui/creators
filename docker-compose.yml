# Local development stack: API + MongoDB + Redis.
# Usage: docker compose up --build
services:
  # Single-node replica set — required for multi-document transactions (the
  # billing credit flow uses them). The healthcheck doubles as a one-time
  # initiator: on first boot rs.status() throws (no config yet) so we run
  # rs.initiate(); thereafter it just reports the set is healthy. `server`
  # waits on `condition: service_healthy`, so it only starts once the set is up.
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Stateless API. No host port is published so it can be scaled to N replicas
  # (`docker compose up --scale server=3`); the nginx LB is the only entrypoint.
  server:
    build:
      context: ./server
    restart: unless-stopped
    expose:
      - '4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      CORS_ORIGINS: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/reelo?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      # We sit behind nginx, so trust X-Forwarded-* for correct client IPs.
      TRUST_PROXY: 'true'
      # Dev-only secrets — override in real environments. NODE_ENV=production
      # rejects the schema's publicly-known dev defaults, so every secret must
      # be set here (these values just need to differ from those defaults).
      JWT_ACCESS_SECRET: dev-access-secret-please-change-me-0123456789
      JWT_REFRESH_SECRET: dev-refresh-secret-please-change-me-0123456789
      GENERATION_CALLBACK_SECRET: dev-generation-callback-secret-compose
      CONNECTIONS_ENC_KEY: dev-connections-encryption-key-compose
      PUBLISH_SCHEDULER_SECRET: dev-publish-scheduler-secret-compose
      PAYMENT_WEBHOOK_SECRET: dev-payment-webhook-secret-compose
      # Kling AI generator — passed through from your shell / repo-root .env
      # (blank = use the stub; nothing is committed).
      KLING_ACCESS_KEY: ${KLING_ACCESS_KEY:-}
      KLING_SECRET_KEY: ${KLING_SECRET_KEY:-}
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Reverse proxy / load balancer — the public entrypoint, balancing across
  # all `server` replicas.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data:
